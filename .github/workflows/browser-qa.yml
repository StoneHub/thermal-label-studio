name: Label browser QA
on:
  pull_request:
    branches: [codex/phone-first-editor]
    paths: ['apps/web/**', 'packages/core/**', 'e2e/**', 'playwright.config.ts', 'package.json', 'pnpm-lock.yaml', '.github/workflows/browser-qa.yml']
permissions:
  contents: read
concurrency:
  group: label-browser-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  mobile:
    # Public standard runners are free. Do not silently spend if visibility changes.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - run: npm install --global pnpm@9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm typecheck && pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      # No cache/artifact upload: storage budgets cannot be verified here.
      # Two bounded synthetic PNGs are emitted in free logs for human review.
